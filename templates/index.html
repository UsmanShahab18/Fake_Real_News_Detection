<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { padding-top: 20px; }
        .container { max-width: 800px; }
        #result { margin-top: 20px; font-size: 1.2em; }
        .spinner-border { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">Fake News Detector</h1>
        <form id="news-form">
            <div class="mb-3">
                <label for="newsText" class="form-label">Enter News Text:</label>
                <textarea class="form-control" id="newsText" name="newsText" rows="10" required placeholder="Paste the news article text here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Check News
            </button>
        </form>

        <div id="result" class="mt-4 alert" role="alert" style="display: none;">
            </div>
        <div id="error-message" class="mt-4 alert alert-danger" role="alert" style="display: none;">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        const newsForm = document.getElementById('news-form');
        const newsText = document.getElementById('newsText');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error-message');
        const submitButton = newsForm.querySelector('button[type="submit"]');
        const spinner = submitButton.querySelector('.spinner-border');

        newsForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const text = newsText.value.trim();
            if (!text) {
                showError('Please enter some news text.');
                return;
            }

            showLoading(true);
            hideResult();
            hideError();

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                showResult(data.prediction_label);

            } catch (error) {
                console.error('Prediction Error:', error);
                showError(error.message || 'Failed to get prediction. Please try again.');
            } finally {
                showLoading(false);
            }
        });

        function showLoading(isLoading) {
            if (isLoading) {
                spinner.style.display = 'inline-block';
                submitButton.disabled = true;
            } else {
                spinner.style.display = 'none';
                submitButton.disabled = false;
            }
        }

        function showResult(prediction) {
            resultDiv.textContent = `Prediction: ${prediction}`;
            if (prediction.toLowerCase().includes('real')) {
                resultDiv.className = 'mt-4 alert alert-success';
            } else if (prediction.toLowerCase().includes('fake')) {
                resultDiv.className = 'mt-4 alert alert-danger';
            } else {
                resultDiv.className = 'mt-4 alert alert-warning';
            }
            resultDiv.style.display = 'block';
        }

        function hideResult() {
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';
        }

        function showError(message) {
            errorDiv.textContent = `Error: ${message}`;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }

    </script>
</body>
</html>
